# Continuous integration.
#
# I. Job layout
#
# 1. `quality` is the single gate for everything that can be checked without a
#    browser: type safety across the four tsconfig projects, linting, formatting,
#    unit + integration tests and the production build. Running the build here
#    means the artefact the E2E job tests is the artefact CI would ship.
# 2. `e2e` runs the Playwright suite against that exact artefact (downloaded as
#    an artifact) instead of rebuilding it, so a green E2E run certifies the same
#    bytes the deploy workflow uploads.
# 3. Nothing runs on a machine without a browser, so the browser suite is the
#    only job that installs Playwright.
#
# II. Action versions
#
# The `vN` tags below are the current majors (checkout v7, setup-node v7,
# pnpm/action-setup v6, upload-artifact v7). pnpm itself is pinned through the
# `packageManager` field in package.json, which the setup action reads.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Typecheck, lint, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Unit & integration tests with coverage
        run: pnpm run test:coverage

      - name: Production build
        run: pnpm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: Browser E2E & visual checks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm run test:e2e:run
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-artifacts
          path: test-results/visual
          retention-days: 14
